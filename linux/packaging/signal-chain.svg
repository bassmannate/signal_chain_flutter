<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121318"/>
      <stop offset="50%" stop-color="#1a1c23"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </linearGradient>

    <!-- Bezel Gradient -->
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3139"/>
      <stop offset="100%" stop-color="#16181d"/>
    </linearGradient>

    <!-- Glow & Accents -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00B0FF"/>
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9100"/>
      <stop offset="100%" stop-color="#FF3D00"/>
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00B248"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Square App Icon Base -->
  <rect x="24" y="24" width="464" height="464" rx="100" ry="100" fill="url(#bgGrad)" stroke="url(#bezelGrad)" stroke-width="8" filter="url(#shadow)"/>

  <!-- Subtle Studio Grid Lines -->
  <path d="M 24 160 L 488 160 M 24 256 L 488 256 M 24 352 L 488 352" stroke="#252833" stroke-width="2" stroke-dasharray="6,6" opacity="0.4"/>
  <path d="M 160 24 L 160 488 M 256 24 L 256 488 M 352 24 L 352 488" stroke="#252833" stroke-width="2" stroke-dasharray="6,6" opacity="0.4"/>

  <!-- Audio Waveform / Signal Chain Sine Wave Curve -->
  <path d="M 64 256 C 112 140, 160 140, 208 256 C 256 372, 304 372, 352 256 C 400 140, 448 180, 464 256" 
        fill="none" stroke="url(#cyanGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>

  <!-- Interconnected Signal Nodes (Pedalboard / Stompbox Blocks) -->
  <!-- Block 1: Right/Input (Dynamics/Green) -->
  <rect x="330" y="206" width="90" height="100" rx="18" fill="#1e222b" stroke="url(#greenGrad)" stroke-width="5" filter="url(#shadow)"/>
  <!-- Stomp LED 1 -->
  <circle cx="375" cy="232" r="7" fill="#00E676" filter="url(#glowCyan)"/>
  <!-- Mini Knobs 1 -->
  <circle cx="355" cy="272" r="8" fill="#374151" stroke="#4b5563" stroke-width="2"/>
  <circle cx="395" cy="272" r="8" fill="#374151" stroke="#4b5563" stroke-width="2"/>

  <!-- Block 2: Center (Drive/Amp - Amber/Red) -->
  <rect x="211" y="196" width="90" height="120" rx="18" fill="#1e222b" stroke="url(#amberGrad)" stroke-width="5" filter="url(#shadow)"/>
  <!-- Stomp LED 2 -->
  <circle cx="256" cy="226" r="7" fill="#FF9100"/>
  <!-- Mini Knobs 2 -->
  <circle cx="236" cy="268" r="9" fill="#374151" stroke="#FF9100" stroke-width="2"/>
  <circle cx="276" cy="268" r="9" fill="#374151" stroke="#4b5563" stroke-width="2"/>
  <rect x="236" y="292" width="40" height="10" rx="3" fill="#111317"/>

  <!-- Block 3: Left/Output (Mod/Delay - Cyan) -->
  <rect x="92" y="206" width="90" height="100" rx="18" fill="#1e222b" stroke="url(#cyanGrad)" stroke-width="5" filter="url(#shadow)"/>
  <!-- Stomp LED 3 -->
  <circle cx="137" cy="232" r="7" fill="#00E5FF" filter="url(#glowCyan)"/>
  <!-- Mini Knobs 3 -->
  <circle cx="117" cy="272" r="8" fill="#374151" stroke="#4b5563" stroke-width="2"/>
  <circle cx="157" cy="272" r="8" fill="#374151" stroke="#4b5563" stroke-width="2"/>

  <!-- Signal Path Leftward Arrows (RTL Audio Flow: OUT to IN) -->
  <!-- Cable 1: Block 1 -> Block 2 -->
  <path d="M 330 256 L 305 256" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <polygon points="307,251 299,256 307,261" fill="#00E5FF"/>

  <!-- Cable 2: Block 2 -> Block 3 -->
  <path d="M 211 256 L 186 256" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <polygon points="188,251 180,256 188,261" fill="#00E5FF"/>

  <!-- IN Indicator (Right) -->
  <circle cx="445" cy="256" r="10" fill="#00E676" opacity="0.8"/>
  <path d="M 445 256 L 424 256" fill="none" stroke="#00E676" stroke-width="4"/>
  <polygon points="426,252 418,256 426,260" fill="#00E676"/>

  <!-- OUT Indicator (Left) -->
  <circle cx="67" cy="256" r="10" fill="#00E5FF" opacity="0.8"/>
  <path d="M 88 256 L 67 256" fill="none" stroke="#00E5FF" stroke-width="4"/>
  <polygon points="75,252 67,256 75,260" fill="#00E5FF"/>

  <!-- 5-Pin DIN MIDI Plug Arc Accent at the Bottom -->
  <g transform="translate(256, 400)">
    <circle cx="0" cy="0" r="32" fill="#16181f" stroke="#374151" stroke-width="4"/>
    <!-- 5 Pins in 180 arc -->
    <circle cx="-16" cy="2" r="3.5" fill="#9ca3af"/>
    <circle cx="-11" cy="-12" r="3.5" fill="#9ca3af"/>
    <circle cx="0" cy="-16" r="3.5" fill="#9ca3af"/>
    <circle cx="11" cy="-12" r="3.5" fill="#9ca3af"/>
    <circle cx="16" cy="2" r="3.5" fill="#9ca3af"/>
    <!-- Center Guide Notch -->
    <path d="M -4 14 L 4 14 L 0 8 Z" fill="#4b5563"/>
  </g>
</svg>
