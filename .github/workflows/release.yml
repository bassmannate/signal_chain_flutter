name: Build & Publish Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-pub --no-fatal-infos
      - run: flutter test --no-pub

  build-linux:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libasound2-dev fuse libfuse2
      - name: Build Linux release & packages
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          flutter build linux --release --no-pub
          curl -fsSL -o tool/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x tool/appimagetool
          ./tool/package_linux_deb.sh "${VERSION}"
          ./tool/package_linux_appimage.sh "${VERSION}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist/*.deb
            dist/*.AppImage

  build-android:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Configure Android Release Signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release-keystore.jks"
            echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/release-keystore.jks" >> "${GITHUB_ENV}"
            echo "Configured release keystore for Android APK signing."
          else
            echo "ANDROID_KEYSTORE_BASE64 not set; falling back to debug signing config."
          fi
      - name: Build Android Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          flutter build apk --release --no-pub --android-skip-build-dependency-validation
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/signal-chain-${VERSION}-android.apk"
      - name: Clean Up Temporary Keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/release-keystore.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: dist/*.apk

  build-windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Build Windows Release & ZIP
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          flutter build windows --release --no-pub
          pwsh -File tool/package_windows_zip.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/*.zip

  publish-release:
    needs: [build-linux, build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 Checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: release-assets/*
